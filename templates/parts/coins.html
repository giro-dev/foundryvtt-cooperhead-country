<div id="character-{{_id}}-coins" class="flex-horizontal">

  <div id="character-{{_id}}-cash">
    <div class="stripe">
      <b>{{localize "CC.Cash"}}</b>
    </div>
    <div class="coins coins-hands">
      {{#multiboxes system.cash}}
      <input type="radio" id="cash-{{_id}}-0" name="system.cash" value="0" checked="checked">
      {{#times_from 1 system.cash_max}}
      <input type="radio" id="cash-{{../_id}}-{{this}}" name="system.cash" value="{{this}}">
      <label class="radio-toggle" for="cash-{{../_id}}-{{this}}"></label>
      {{/times_from}}
      {{/multiboxes}}
    </div>
  </div>

  <div id="character-{{_id}}-bank">
    <div class="stripe">
      <b>{{localize "CC.Bank"}}</b>
    </div>
    <input type="number" id="bank-{{_id}}" name="system.bank" value="{{system.bank}}" min="0" step="1" style="width: 4em">
  </div>

</div>
